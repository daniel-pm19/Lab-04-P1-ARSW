version: '3.8'

services:
  db:
    image: postgres:15
    container_name: blueprints-db
    environment:
      POSTGRES_DB: blueprints
      POSTGRES_USER: blueprints_user
      POSTGRES_PASSWORD: blueprints_pass
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
